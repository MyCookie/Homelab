name: spark

include:
  - services/monitoring.yaml
  - services/llamacpp-router.yaml
  - services/openwebui.yaml

services:
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_CLEANUP_VOLUMES=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  dozzle:
    image: amir20/dozzle
    container_name: dozzle
    hostname: dozzle
    restart: unless-stopped
    networks:
      - spark
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  spark:
